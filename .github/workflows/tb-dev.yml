name: TB pipeline (dev)
on:
  push:
    branches: [tb-dev]
    paths: ['scripts/tb/**', '.github/workflows/tb-dev.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pip install -q requests numpy rasterio shapely h3 scipy pyshp
      - run: python scripts/tb/build_tb3.py
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: DHIMS2 sync (skips when not configured)
        run: node scripts/tb/dhims2.mjs
        env:
          SUPABASE_URL: https://sfjcioilzidqskzmqpog.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DHIMS2_URL: ${{ secrets.DHIMS2_URL }}
          DHIMS2_USERNAME: ${{ secrets.DHIMS2_USERNAME }}
          DHIMS2_PASSWORD: ${{ secrets.DHIMS2_PASSWORD }}
          DHIMS2_TOKEN: ${{ secrets.DHIMS2_TOKEN }}
          DHIMS2_DX: ${{ secrets.DHIMS2_DX }}
      - name: Summary
        run: |
          python - <<'PY'
          import json, numpy as np, os
          m = json.load(open('public/data/tb/meta.json')); print(json.dumps({k: m[k] for k in ('method', 'national', 'counts')}, indent=1))
          for s in m['sources']: print('SRC', s['ok'], s['name'], s.get('note', '')[:140])
          d = [f['properties'] for f in json.load(open('public/data/tb/districts.geojson'))['features']]
          for k in ('expected_100k', 'vs_ghana', 'age_effect', 'risk_effect', 'poverty', 'crowding', 'insured', 'walk_far', 'adults', 'urban'):
              v = np.array([x[k] for x in d if x.get(k) is not None], float); print(k, len(v), np.percentile(v, [0, 10, 50, 90, 100]).round(3) if len(v) else '-')
          top = sorted(d, key=lambda x: -x['expected_100k'])[:10]; print('top rate', [(x['name'], x['expected_100k'], x['vs_ghana']) for x in top])
          top = sorted(d, key=lambda x: -x['expected'])[:10]; print('top count', [(x['name'], x['expected']) for x in top])
          sz = sum(os.path.getsize(os.path.join('public/data/tb/d', f)) for f in os.listdir('public/data/tb/d')); print('district files MB', round(sz / 1e6, 1), len(os.listdir('public/data/tb/d')))
          x = json.load(open('public/data/tb/d/' + top[0]['id'] + '.json')); print('sample', top[0]['id'], len(x['hexes']), len(x['towns']), len(x['venues']), len(x['facilities'])); print([{k: v for k, v in t.items() if k != 'geom'} for t in x['towns'][:3]]); print(x['venues'][:3])
          PY
      - name: Commit outputs to this branch
        run: |
          git config user.name "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          git add public/data/tb
          git commit -m "tb data (dev) [skip ci]" || echo "no changes"
          git pull --rebase -X theirs origin tb-dev && git push
