name: Preview build

on:
  push:
    branches: [editor-preview]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and build (demo mode, no Supabase)
        run: |
          set +e
          { npm install --no-audit --no-fund 2>&1; echo "INSTALL_EXIT=$?"; } | tee build.log
          { npm ls @blocknote/core @blocknote/react @blocknote/mantine @mantine/core prosemirror-view 2>&1; } | tee -a build.log
          { REACT_APP_SUPABASE_URL= REACT_APP_SUPABASE_ANON_KEY= CI=false TSC_COMPILE_ON_ERROR=true npm run build 2>&1; echo "BUILD_EXIT=$?"; } | tee -a build.log
          exit 0
      - name: Publish build output to the preview-build branch
        run: |
          mkdir -p out && cp build.log out/ && (cp -r build/. out/ 2>/dev/null || true)
          cd out
          git init -q -b preview-build
          git config user.name "waig-atlas-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "preview ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" preview-build
