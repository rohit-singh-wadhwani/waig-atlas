name: Refresh data and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      jobs:
        description: "Data jobs to run first (comma list: scout,grants,insights,health,tb or none)"
        default: "scout,grants,insights,health,tb"
  schedule:
    - cron: "17 */3 * * *"   # insights every 3 hours
    - cron: "41 1,13 * * *"  # grants every 12 hours (07:11 and 19:11 IST)
    - cron: "53 0 * * *"     # health datasets daily (06:23 IST)
    - cron: "29 2 * * *"     # grant scout daily (07:59 IST)
    - cron: "7 3 * * 1"      # TB surveillance data + AI brief, Mondays (08:37 IST)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-and-deploy
  cancel-in-progress: false

env:
  SUPABASE_URL: https://sfjcioilzidqskzmqpog.supabase.co

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # always build the latest data, even when a run was queued behind a data refresh
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pick jobs
        id: pick
        run: |
          case "${{ github.event_name }}:${{ github.event.schedule }}" in
            "schedule:17 */3 * * *") J="insights" ;;
            "schedule:41 1,13 * * *") J="grants" ;;
            "schedule:53 0 * * *") J="health" ;;
            "schedule:29 2 * * *") J="scout,grants" ;;
            "schedule:7 3 * * 1") J="tb" ;;
            workflow_dispatch:*) J="${{ github.event.inputs.jobs }}" ;;
            *) J="none" ;;
          esac
          # first deploy ever: fetch everything
          if [ ! -f public/data/health.json ] && [ "$J" = "none" ]; then J="grants,insights,health"; fi
          echo "jobs=$J" >> "$GITHUB_OUTPUT"
          echo "Running: $J"
      - name: Health datasets
        timeout-minutes: 20
        continue-on-error: true
        if: contains(steps.pick.outputs.jobs, 'health')
        run: node scripts/fetch-health.mjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_SEARCH: ${{ vars.GEMINI_SEARCH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Insights
        timeout-minutes: 20
        continue-on-error: true
        if: contains(steps.pick.outputs.jobs, 'insights')
        run: node scripts/fetch-insights.mjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_SEARCH: ${{ vars.GEMINI_SEARCH }}
      - name: Set up Python (TB)
        if: contains(steps.pick.outputs.jobs, 'tb')
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: TB surveillance data
        if: contains(steps.pick.outputs.jobs, 'tb')
        timeout-minutes: 50
        continue-on-error: true
        run: |
          pip install -q requests numpy rasterio shapely h3 scipy pyshp
          python scripts/tb/build_tb3.py
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: DHIMS2 district notifications (skips until credentials are set)
        if: contains(steps.pick.outputs.jobs, 'tb')
        timeout-minutes: 10
        continue-on-error: true
        run: node scripts/tb/dhims2.mjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DHIMS2_URL: ${{ secrets.DHIMS2_URL }}
          DHIMS2_USERNAME: ${{ secrets.DHIMS2_USERNAME }}
          DHIMS2_PASSWORD: ${{ secrets.DHIMS2_PASSWORD }}
          DHIMS2_TOKEN: ${{ secrets.DHIMS2_TOKEN }}
          DHIMS2_DX: ${{ secrets.DHIMS2_DX }}
      - name: TB weekly AI brief
        if: contains(steps.pick.outputs.jobs, 'tb')
        timeout-minutes: 15
        continue-on-error: true
        run: node scripts/tb/brief.mjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_BUDGET_MIN: 12
      - name: Grant scout
        timeout-minutes: 25
        continue-on-error: true
        if: contains(steps.pick.outputs.jobs, 'scout')
        run: node scripts/scout-grants.mjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_BUDGET_MIN: 20
      - name: Grants
        timeout-minutes: 20
        continue-on-error: true
        if: contains(steps.pick.outputs.jobs, 'grants')
        run: node scripts/fetch-grants.mjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_SEARCH: ${{ vars.GEMINI_SEARCH }}
      - name: Commit data
        if: steps.pick.outputs.jobs != 'none'
        run: |
          git config user.name "waig-atlas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then echo "no data changes"; else
            git commit -m "data: refresh ${{ steps.pick.outputs.jobs }} [skip ci]"
            git pull --rebase origin main && git push
          fi
      - name: Build
        run: |
          npm install --no-audit --no-fund
          npm run build
        env:
          CI: false
          TSC_COMPILE_ON_ERROR: true
          REACT_APP_BUILD: ${{ github.run_number }}-${{ github.sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
