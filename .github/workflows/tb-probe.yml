name: TB data probe
on:
  push:
    branches: [tb-dev]
    paths: ['scripts/tb/probe.py']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests pyshp
      - run: python scripts/tb/probe.py
