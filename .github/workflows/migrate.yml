name: One-off data migration
on:
  push:
    branches: [tb-dev]
    paths: ['scripts/migrations/**', '.github/workflows/migrate.yml']
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/migrations/2026-11-milestones.mjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: https://sfjcioilzidqskzmqpog.supabase.co
